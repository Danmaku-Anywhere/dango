name: Release

# Publishes both packages to npm on a version tag (e.g. v0.4.0) via OIDC
# trusted publishing — no NPM_TOKEN. Prerequisites (configured outside this repo):
#   - a `release` GitHub environment
#   - a trusted publisher on npm for @mr-quin/dango AND @mr-quin/dango-manifests
#     (repo Danmaku-Anywhere/dango, workflow release.yml, environment release)

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tagged commit is on main or a release branch
        run: |
          git fetch origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/release/*:refs/remotes/origin/release/*'
          for ref in refs/remotes/origin/main $(git for-each-ref --format='%(refname)' 'refs/remotes/origin/release/*'); do
            if git merge-base --is-ancestor "$GITHUB_SHA" "$ref"; then
              echo "$GITHUB_SHA is on $ref"
              exit 0
            fi
          done
          echo "::error::$GITHUB_SHA is not on main or a release/* branch, refusing to publish it"
          exit 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Verify tag matches package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          case "$tag" in
            *-*) echo "::error::$tag is a prerelease; -dev versions are never released"; exit 1 ;;
          esac
          for pkg in dango dango-manifests; do
            ver=$(node -p "require('./packages/$pkg/package.json').version")
            [ "$ver" = "$tag" ] || { echo "::error::packages/$pkg is $ver, tag is $tag"; exit 1; }
          done
      - run: npm install -g npm@latest # OIDC publishing needs npm >= 11.5.1
      - run: bun install --frozen-lockfile
      - run: bun run catalog:check
      - run: bun run build
      - run: bun run type-check
      - run: bun run lint
      - run: bun run format:check
      - run: bun test
      - name: Publish @mr-quin/dango
        working-directory: packages/dango
        run: |
          name=$(node -p "require('./package.json').name")
          ver=$(node -p "require('./package.json').version")
          errfile=$(mktemp)
          if found=$(npm view "$name@$ver" version 2>"$errfile"); then
            :
          elif grep -q 'E404' "$errfile"; then
            found=
          else
            echo "::error::npm view failed: $(cat "$errfile")"
            exit 1
          fi
          if [ "$found" = "$ver" ]; then
            echo "$name@$ver is already on npm, skipping"
          else
            npm publish --access public
          fi
      - name: Publish @mr-quin/dango-manifests
        working-directory: packages/dango-manifests
        run: |
          name=$(node -p "require('./package.json').name")
          ver=$(node -p "require('./package.json').version")
          errfile=$(mktemp)
          if found=$(npm view "$name@$ver" version 2>"$errfile"); then
            :
          elif grep -q 'E404' "$errfile"; then
            found=
          else
            echo "::error::npm view failed: $(cat "$errfile")"
            exit 1
          fi
          if [ "$found" = "$ver" ]; then
            echo "$name@$ver is already on npm, skipping"
          else
            npm publish --access public
          fi
